name: Create Release on Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Release Name
        run: |
          chmod +x ./.agents/skills/sap-dev/bin/sap-bridge
          VERSION=$(./.agents/skills/sap-dev/bin/sap-bridge --version)
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Zip Folder
        run: zip -r "sap-dev-${{ env.RELEASE_VERSION }}.zip" .agents hooks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: sap-dev-${{ env.RELEASE_VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}